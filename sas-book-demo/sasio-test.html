<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>sasio-Test</title>
<p id="status">sasio-Test wird geladen.</p>
<script type="module">
    try {
        const response = await fetch("./examples/SASIOTest.java");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const runner = new URL("./runner.html", location.href);
        runner.hash = new URLSearchParams({ code: await response.text() }).toString();
        location.replace(runner.href);
    } catch (error) {
        document.getElementById("status").textContent = `Test konnte nicht geladen werden: ${error.message}`;
    }
</script>
</html>
